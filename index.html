<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mural de Produção</title>
<link rel="icon" type="image/png" href="Imagens/%C3%8DCONE%20SITE.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://alcdn.msauth.net">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://graph.microsoft.com">
<link rel="preload" as="script" href="app.js">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <section id="loginView" class="view">
    <div class="login-hero">
      <span class="login-mark">MINIMAL</span>
      <h1>Produção, do chão de fábrica ao administrativo.</h1>
    </div>

    <div class="login-panel">
      <div class="login-card">
        <h2>Entrar</h2>
        <button id="loginBtn" class="btn-primary">Entrar com Microsoft</button>
        <div id="loginError"></div>
      </div>
    </div>
  </section>

  <section id="demandasView" class="view" hidden>
    <header class="app-header">
      <img src="Imagens/LOGO%20MINIMAL.png" class="app-logo" alt="MINIMAL">
      <h1 id="setorNome">Setor</h1>
      <div id="filtrosAdmin" class="filtros-admin" hidden>
        <select id="setorFiltro" class="setor-filtro"></select>
        <input type="search" id="buscaPedido" class="busca-pedido" placeholder="Buscar nº do pedido ou cliente">
        <select id="filtroTipo" class="setor-filtro">
          <option value="todos">Todos os tipos</option>
          <option value="AT">Somente AT</option>
          <option value="normal">Pedidos normais</option>
        </select>
        <span id="contadorPedidos" class="contador-pedidos"></span>
      </div>
      <button id="logoutBtn" class="btn-secondary">Sair</button>
    </header>
    <main class="cards-wrapper">
      <div id="demandasCards" class="cards-list"></div>
      <p id="semResultados" class="empty-message" hidden>Nenhum pedido encontrado.</p>
    </main>
  </section>

  <div id="pdfModal" class="pdf-modal" hidden>
    <div class="pdf-modal-content">
      <button id="closePdfBtn" class="btn-close">&times;</button>
      <iframe id="pdfFrame" title="Visualização do PDF"></iframe>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
  <script>
    function tudoPronto() {
      return typeof msal !== 'undefined' && typeof pdfjsLib !== 'undefined';
    }
    function aguardarECarregarApp() {
      if (tudoPronto()) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';
        var appScript = document.createElement('script');
        appScript.src = 'app.js';
        document.body.appendChild(appScript);
      } else {
        setTimeout(aguardarECarregarApp, 50);
      }
    }
    aguardarECarregarApp();
  </script>
</body>
</html>
