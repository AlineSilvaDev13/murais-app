<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mural de Produção</title>
<link rel="icon" type="image/png" href="Imagens/%C3%8DCONE%20SITE.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <section id="loginView" class="view">
    <div class="login-hero">
      <span class="login-mark">MINIMAL</span>
      <h1>Produção, do chão de fábrica ao administrativo.</h1>
    </div>

    <div class="login-panel">
      <div class="login-card">
        <h2>Entrar</h2>
        <button id="loginBtn" class="btn-primary">Entrar com Microsoft</button>
        <div id="loginError"></div>
      </div>
    </div>
  </section>

  <section id="demandasView" class="view" hidden>
    <header class="app-header">
      <img src="Imagens/LOGO%20MINIMAL.jpg" class="app-logo" alt="MINIMAL">
      <h1 id="setorNome">Setor</h1>
      <button id="logoutBtn" class="btn-secondary">Sair</button>
    </header>
    <main class="cards-wrapper">
      <div id="demandasCards" class="cards-list"></div>
    </main>
  </section>

  <div id="pdfModal" class="pdf-modal" hidden>
    <div class="pdf-modal-content">
      <button id="closePdfBtn" class="btn-close">&times;</button>
      <iframe id="pdfFrame" title="Visualização do PDF"></iframe>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
  <script>
  if (typeof msal === 'undefined') document.write(unescape("%3Cscript src='https://alcdn.msftauth.net/browser/2.35.0/js/msal-browser.min.js' type='text/javascript'%3E%3C/script%3E"));
  </script>
  <script src="app.js"></script>
</body>
</html>
